# Blueprint Render : provisionne automatiquement le service web + la base PostgreSQL.
# Utilisation : sur render.com -> New -> Blueprint -> sélectionner ce dépôt GitHub.
# Les clés marquées "sync: false" doivent être saisies à la main dans le Dashboard
# Render (onglet Environment) : elles ne sont JAMAIS stockées dans ce fichier ni le dépôt.
version: "1"

services:
  - type: web
    name: rbnb-togo
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true          # Render génère une valeur aléatoire sécurisée
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: rbnb-togo-db
          property: connectionString
      # Paiement CinetPay — à saisir dans le Dashboard une fois le compte créé
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_BASE_URL
        value: "https://api-checkout.cinetpay.com/v2"
      # Stockage des photos — à saisir dans le Dashboard une fois le compte Cloudinary créé
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: rbnb-togo-db
    plan: free
    databaseName: rbnb_togo
    user: rbnb_togo_user
